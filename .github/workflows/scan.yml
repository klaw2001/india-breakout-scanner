name: Breakout data

# GitHub cron is UTC and can start 5-30 min late; the Claude runs that read this data are scheduled with slack.
on:
  schedule:
    - cron: "13 21 * * 0-4"   # 02:43 IST Mon-Fri  -> intraday (after the US close)
    - cron: "17 13 * * 1-5"   # 18:47 IST Mon-Fri  -> swing (bhavcopy with delivery % is out by then); Fridays also long-term
  workflow_dispatch:
    inputs:
      scans:
        description: "Comma list of scans: intraday,swing,longterm"
        required: false
        default: "intraday,swing,longterm"

permissions:
  contents: write

concurrency:
  group: breakout-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - name: Install
        run: pip install -r requirements-scan.txt

      - name: Choose scans
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCANS: ${{ github.event.inputs.scans }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SCANS="${INPUT_SCANS:-intraday,swing,longterm}"
          elif [ "$SCHEDULE" = "13 21 * * 0-4" ]; then
            SCANS="intraday"
          else
            SCANS="swing"
            if [ "$(TZ=Asia/Kolkata date +%u)" = "5" ]; then SCANS="swing,longterm"; fi
          fi
          if ! echo "$SCANS" | grep -Eq '^[a-z,]+$'; then echo "bad scans: $SCANS"; exit 1; fi
          echo "scans=$SCANS" >> "$GITHUB_OUTPUT"
          echo "Running: $SCANS"

      - name: Run scans
        run: python -m scanner.scan --scans "${{ steps.pick.outputs.scans }}"

      - name: Commit data
        if: always()
        env:
          SCANS: ${{ steps.pick.outputs.scans }}
        run: |
          git config user.name "breakout-bot"
          git config user.email "breakout-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "data: $SCANS $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep 7; done
          exit 1
